{% extends "base.html" %}

{% block body %}
    <center>
<h2 style="color:white">TASK MANAGER</h2>
    {% if view_list %}
        <table style="background-color:black" width="500">
            <tr style="background-color:white">
                <th>TASKS</th><th>DATE</th><th>ACTION</th>
            </tr>
            {% for x in view_list %}
            <tr style="background-color:white">
                <td>{{ x["tasks"] }}</td><td align="center">{{ x["date_time"] }}</td>
                <td align="center"><a href= "{{ url_for('modify.update_route',no=x['id']) }}">UPDATE<br></a><a href="{{ url_for('modify.del_route',no=x['id']) }}">DELETE</a></td>
            </tr>
            {% endfor %}
        </table><br>
    {% else %}
        <h4 style="color:white">--------- Your task is empty ---------</h4>
    {% endif %}
        <form action="/" method="POST">
            <input type="text" name="content" id="content" placeholder="enter your task here">
            <input type="submit" value="ADD TASK">
        </form>
    </center>
{% endblock %}
